[build]
  command = "node scripts/check-web-api-url.mjs && npm ci && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Baked into the web bundle at build time — do not use localhost here.
  EXPO_PUBLIC_API_URL = "https://dars-api-oqtb.onrender.com/api/v1"

# SPA fallback so Expo Router client routes work on refresh / deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
